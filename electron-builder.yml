# electron-builder.yml — unsigned (ad-hoc) local macOS build, arm64 only.
appId: com.kirathecat.kira-studio          # §3 "bundle ID com.kirathecat.kira-studio"
productName: Kira Studio                    # matches app.setName() in src/main/index.ts
copyright: Copyright © 2026 kirathecat
directories:
  output: dist                              # already gitignored (line 83)
files:
  - out/**/*                                # electron-vite's build output; `main` points into it
  - package.json
  - '!**/*.map'
  # P32 D7: the vendored librdkafka C/C++ sources and build intermediates are pure build residue —
  # ~11 MB of sources plus ~8 MB of .o files (P32 F19) that the packaged app never touches.
  - '!node_modules/@confluentinc/kafka-javascript/{deps,src,util,examples,ci}/**'
  - '!node_modules/@confluentinc/kafka-javascript/build/Release/{obj.target,.deps}/**'
asar: true
# out/main/engine.js is loaded via `utilityProcess.fork()` (main/engine-host.ts) — a forked entry
# point can't be exec'd from inside the asar archive, so it must be unpacked (P12 plan §5 checklist
# item 3). The Kafka driver's .node is unpacked for the same reason: Electron cannot dlopen a
# native addon from inside an asar archive (P32 D7) — scripts/native-electron-build.sh guarantees
# it is built for Electron's own ABI before packaging runs (P32 D6).
asarUnpack:
  - out/main/engine.js
  - node_modules/@confluentinc/kafka-javascript/build/Release/*.node
# P32 D5: a native production dependency exists now, but npmRebuild stays false — electron-builder's
# own rebuild step shells out to the detected package manager, which does not support Bun.
# scripts/native-electron-build.sh (wired as prepackage:mac) produces the Electron-ABI build before
# electron-builder ever runs, so its own rebuild step has nothing left to do.
npmRebuild: false
electronLanguages:
  - en                                      # dark-mode-only, English-only v1; trims .lproj weight
mac:
  category: public.app-category.developer-tools
  identity: '-'                             # ad-hoc — NOT null (D12)
  hardenedRuntime: false                    # ad-hoc + hardened runtime ⇒ library-validation failure (D12)
  minimumSystemVersion: '13.0'              # §3 "macOS 13+"
  darkModeSupport: true                     # §1 "Dark mode only"
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
dmg:
  writeUpdateInfo: false                    # no auto-update in v1 (§1/§3) — verified, docs/v1/PACKAGING.md §7
artifactName: ${productName}-${version}-${arch}.${ext}
