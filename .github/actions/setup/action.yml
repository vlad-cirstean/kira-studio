name: Setup
description: Shared job setup for PR workflow jobs (bun, Go with a real build cache, wails3 CLI, bindings, optional GTK headers).

inputs:
  bun:
    description: Install bun and node_modules.
    default: "true"
  go-cache:
    description: Name of the Go build cache entry (one per job kind). Empty skips the Go build cache.
    default: ""
  gtk:
    description: Install GTK4/WebKitGTK headers even when the wails3 CLI cache hits (a job that runs cgo builds).
    default: "false"
  bindings:
    description: Build the wails3 CLI and generate bindings (scripts/setup.sh).
    default: "true"
  cache-save:
    description: Save caches at job end. "false" only restores (a tag run saves into a tag-scoped cache nothing later restores).
    default: "true"

  visual-fonts:
    description: Install fonts-inter and the fontconfig rule that resolves sans-serif to Inter (visual baselines render Inter).
    default: "false"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: inputs.bun == 'true'
      with:
        bun-version: 1.4.4
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: go.mod
        cache: false
    - name: Locate the Go caches
      shell: bash
      run: |
        echo "GOCACHE_DIR=$(go env GOCACHE)" >> "$GITHUB_ENV"
        echo "GOMODCACHE_DIR=$(go env GOMODCACHE)" >> "$GITHUB_ENV"
    - name: Cache Go modules (keyed on go.sum)
      id: gomod
      if: inputs.cache-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.GOMODCACHE_DIR }}
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
    - name: Restore Go modules (keyed on go.sum)
      id: gomod-restore
      if: inputs.cache-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.GOMODCACHE_DIR }}
        key: gomod-${{ runner.os }}-${{ hashFiles('go.sum') }}
    - name: Download Go modules on a cache miss (retried; go has no retry of its own)
      if: steps.gomod.outputs.cache-hit != 'true' && steps.gomod-restore.outputs.cache-hit != 'true'
      shell: bash
      # Worst case 3 x 120 s + 30 s sleeps = 390 s; with the apt step it fits the caller's 10-minute step.
      run: sh scripts/retry.sh 3 120 go mod download
    - name: Cache Go build and test results (saved per commit, restored from the newest entry; setup-go's go.sum-keyed entry is never refreshed and goes stale)
      if: inputs.go-cache != '' && inputs.cache-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.GOCACHE_DIR }}
        key: gobuild-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('go.sum') }}-
          gobuild-${{ runner.os }}-${{ inputs.go-cache }}-
    - name: Restore Go build and test results (saved per commit, restored from the newest entry; setup-go's go.sum-keyed entry is never refreshed and goes stale)
      if: inputs.go-cache != '' && inputs.cache-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ env.GOCACHE_DIR }}
        key: gobuild-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('go.sum') }}-${{ github.sha }}
        restore-keys: |
          gobuild-${{ runner.os }}-${{ inputs.go-cache }}-${{ hashFiles('go.sum') }}-
          gobuild-${{ runner.os }}-${{ inputs.go-cache }}-
    - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
      if: inputs.bun == 'true' && inputs.cache-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - name: Restore bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
      if: inputs.bun == 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
    - name: Install dependencies
      if: inputs.bun == 'true'
      shell: bash
      run: bun install --frozen-lockfile
    - name: Cache wails3 CLI (go.mod-keyed, OS-specific binary)
      if: inputs.bindings == 'true' && inputs.cache-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/bin/wails3
        key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
    - name: Restore wails3 CLI (go.mod-keyed, OS-specific binary)
      if: inputs.bindings == 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/go/bin/wails3
        key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
    - name: Cache generated Wails bindings (platform-independent output, shared across OSes)
      if: inputs.bindings == 'true' && inputs.cache-save == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          apps/kira-studio/frontend/bindings
          apps/kira-studio/.task
        key: wails-bindings-${{ hashFiles('go.mod') }}
    - name: Restore generated Wails bindings (platform-independent output, shared across OSes)
      if: inputs.bindings == 'true' && inputs.cache-save != 'true'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: |
          apps/kira-studio/frontend/bindings
          apps/kira-studio/.task
        key: wails-bindings-${{ hashFiles('go.mod') }}
    - name: Install GTK4/WebKitGTK headers (cgo builds; also needed at runtime to even invoke a cached wails3 binary for its version check, not just to build one on a cache miss; bounded and retried, scripts/ci-apt-install.sh)
      if: runner.os == 'Linux' && (inputs.gtk == 'true' || inputs.bindings == 'true')
      shell: bash
      run: sh scripts/ci-apt-install.sh libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
    - name: Generate Wails bindings
      if: inputs.bindings == 'true'
      shell: bash
      run: sh scripts/setup.sh
    - name: Install visual-baseline fonts (fonts-inter 4.0+ds-1 from noble/universe; the rule makes sans-serif resolve to Inter, as in the baseline-capture sandbox)
      if: runner.os == 'Linux' && inputs.visual-fonts == 'true'
      shell: bash
      run: |
        sh scripts/ci-apt-install.sh fonts-inter
        sudo install -m 644 apps/kira-studio/tests/visual/support/fontconfig/56-prefer-inter.conf /etc/fonts/conf.d/
        sudo fc-cache -f
        test "$(fc-match sans-serif -f '%{family}')" = Inter
