name: DB compatibility (on demand)

# P16 D6 (docs/v1.1/plans/P16-db-compat-suite.md §5 C4): workflow_dispatch ONLY. No push, no
# pull_request, no schedule — ci.yml is not edited and does not reference this file, so ordinary
# CI runs are byte-identical to before this workflow existed.
on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'Single kind (postgres, mysqlfamily, clickhouse, mongo, redis, kafka, sqs, s3), or "all"'
        default: 'all'
      extreme:
        description: 'min | max | both'
        default: 'both'

permissions:
  contents: read

jobs:
  db-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Best-effort: the cache holds whichever images the first run after an image-pin change
      # happened to pull, not the full kind/extreme matrix — a later run selecting a different
      # `kind`/`extreme` still pulls what it needs, just not preloaded from this cache.
      - name: Restore cached Docker images (keyed on the pinned image tags, so an unchanged min/max image set skips re-pulling)
        id: docker-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('scripts/db-compat.sh') }}
      - name: Load cached Docker images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/docker-images.tar
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run the compatibility matrix
        # GitHub's own runners reach Docker Hub directly — --mirror is a sandbox-only workaround
        # for the outbound proxy documented in CLAUDE.md, so it is deliberately omitted here.
        run: |
          set -eu
          ARGS=""
          if [ "${{ inputs.kind }}" != "all" ]; then
            ARGS="$ARGS --only ${{ inputs.kind }}"
          fi
          case "${{ inputs.extreme }}" in
            min) ARGS="$ARGS --min" ;;
            max) ARGS="$ARGS --max" ;;
            both|*) ;;
          esac
          sh scripts/db-compat.sh $ARGS
      - name: Save pulled Docker images (always() so a partial pull from a failed run still seeds the next one)
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save $(docker images -q) -o ~/docker-images.tar
      - name: Cache pulled Docker images
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('scripts/db-compat.sh') }}
