name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Full adapter auth/config permutation matrix (P25/P26, docs/v1.1/plans/P25-connection-auth-test-matrix.md).
  # ci.yml deliberately never runs this (it's the on-demand "complete" tier, not the per-push
  # general tier) — a release is exactly the on-demand moment it exists for, so it gates here
  # instead, and this is now the suite's only CI entry point (no more standalone
  # .github/workflows/test-matrix.yml — it added nothing a release gate plus `bun run test:matrix
  # -- --only <kind>` run locally didn't already cover). ubuntu-latest for Docker, same as ci.yml's
  # container-tests job; no bun/Wails setup needed since scripts/test-matrix.sh only calls straight
  # into `go test` against the adapter packages.
  test-matrix:
    name: test-matrix (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sh scripts/test-matrix.sh

  # Same reasoning as test-matrix above, applied to the other on-demand complete-tier suite (P16
  # D5, docs/v1.1/plans/P16-db-compat-suite.md): the per-adapter conformance package test:go
  # already runs, just against each kind's oldest/newest supported server image instead of one
  # pinned default — the one axis a regression could ship on without ci.yml (or this file, before
  # now) ever catching it. Standalone .github/workflows/db-compat.yml dropped for the same reason
  # test-matrix.yml was: this job is now the real gate, and a one-off single-kind/extreme run
  # during adapter work uses `bun run test:compat -- --only <kind> --min|--max` locally instead.
  db-compat:
    name: db-compat (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: sh scripts/db-compat.sh

  release:
    needs: [test-matrix, db-compat]
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary; same key as ci.yml's checks/package-smoke, so a release right after a merge to main usually finds it already warm)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}

      # The one place a build reads a version (apps/kira-studio/Taskfile.yml's APP_VERSION): from
      # here it is linked into the binary and stamped into the bundle's Info.plist, and
      # verify:packaging asserts the packaged bundle came out carrying exactly this string.
      - name: Set the app version from the release tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          CONFIG=apps/kira-studio/build/config.yml
          perl -i -pe 's/^(  version: )"[^"]*"/$1"'"$TAG"'"/' "$CONFIG"
          test "$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "$CONFIG" | head -1)" = "$TAG"
          echo "app version set to $TAG (from tag $GITHUB_REF_NAME)"

          # G10 D21: the extension manifest's own version, kept in lockstep with config.yml's — S9
          # asserts the two agree. Anchored to the top-level "version" key at two-space indent, the
          # same idiom as the config.yml rewrite above.
          VSCODE_PKG=apps/kira-studio-vscode/package.json
          perl -i -pe 's/^(  "version": )"[^"]*"/$1"'"$TAG"'"/' "$VSCODE_PKG"
          test "$(sed -n 's/^  "version": *"\([^"]*\)".*/\1/p' "$VSCODE_PKG" | head -1)" = "$TAG"
          echo "extension version set to $TAG (from tag $GITHUB_REF_NAME)"

      - name: Generate Wails bindings (P20 D7 — routed through scripts/setup.sh)
        run: sh scripts/setup.sh

      - run: bun run lint
      - run: bun run typecheck

      - run: bun run package

      # P10: `bun run package` already produced and signed the .dmg — this only gives it the
      # platform-qualified name the release asset carries.
      - name: Name the signed disk image for distribution
        run: cp "apps/kira-studio/bin/Kira Studio.dmg" "kira-studio-macos-arm64.dmg"

      - name: Verify packaging
        run: bun run verify:packaging

      - name: Assert packaged bundle and disk image (docs/PACKAGING.md §4 — moved here from ci.yml's
          own package-smoke job so it checks the actual tagged release build, not a separate
          merge-to-main run that could sit at a different commit)
        run: |
          set -eu
          APP="apps/kira-studio/bin/Kira Studio.app"
          DMG="apps/kira-studio/bin/Kira Studio.dmg"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" \
            = 'com.kirathecat.kira-studio'
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          # P10 ships the .dmg, so this opens the real thing: the image mounts, the app is inside
          # it, and so is the /Applications shortcut the install gesture needs.
          test -f "$DMG"
          codesign -dv --verbose=2 "$DMG" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/kira-dmg "$DMG"
          test -d "/tmp/kira-dmg/Kira Studio.app"
          test -L "/tmp/kira-dmg/Applications"
          hdiutil detach /tmp/kira-dmg
          du -sh "$APP" "$DMG"

      - name: Compose release notes
        run: |
          cat > release-notes.md <<'EOF'
          Requires macOS 14 or later on Apple Silicon (arm64). Background: docs/PACKAGING.md and
          README.md.

          ## Install

          1. Open the downloaded disk image.
          2. Drag **Kira Studio** onto the **Applications** shortcut inside it.

          ## First launch: Gatekeeper warning

          This build isn't signed by Apple, so macOS blocks it the first time you open it.
          Either of these fixes it:

          - Right-click the app (or the disk image, if it's blocked at that step instead) and
            choose **Open**.
          - Or run this in Terminal, once for the disk image and once for the installed app:

            ```
            xattr -dr com.apple.quarantine ~/Downloads/kira-studio-macos-arm64.dmg
            xattr -dr com.apple.quarantine "/Applications/Kira Studio.app"
            ```

            (adjust the first path if you saved the disk image somewhere else)

          ## No auto-update

          New versions don't install themselves — check back here to download the next one. See
          docs/PACKAGING.md §7 for why, and what would need to change first.
          EOF

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Kira Studio $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            kira-studio-macos-arm64.dmg

      - uses: actions/upload-artifact@v7
        with:
          name: kira-studio-macos-arm64
          path: kira-studio-macos-arm64.dmg
          retention-days: 14
