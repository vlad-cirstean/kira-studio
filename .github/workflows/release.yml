name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Set package.json version from the release tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$TAG"
          echo "package.json version set to $TAG (from tag $GITHUB_REF_NAME)"

      - run: bun run lint
      - run: bun run typecheck

      - run: bun run package:mac

      - name: Drop differential-update payload (no auto-update in v1 — SPEC.md §1/§3, docs/PACKAGING.md §7)
        run: rm -f dist/*.blockmap

      - name: Verify packaging (strict — no update feed or blockmap may reach a release)
        env:
          KIRA_STRICT_UPDATE_CHECK: '1'
        run: bun run verify:packaging

      - name: Compose release notes
        run: |
          cat > release-notes.md <<'EOF'
          Unsigned (ad-hoc), local, arm64-only macOS build — macOS 13+. See docs/PACKAGING.md
          and README.md for details.

          Since this build is unsigned, macOS Gatekeeper will block the first launch. Either
          right-click the app and choose Open, or run:

              xattr -dr com.apple.quarantine "/Applications/Kira Studio.app"

          This release has no auto-update. The artifacts below carry no update metadata or feed
          — see docs/PACKAGING.md §7 for why, and what would need to change first.
          EOF

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Kira Studio $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            dist/*.dmg dist/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kira-studio-macos-arm64
          path: |
            dist/*.dmg
            dist/*.zip
          retention-days: 14
