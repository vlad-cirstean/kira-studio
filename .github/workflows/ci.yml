name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - name: Generate Wails bindings (P20 D7 — routed through scripts/setup.sh, apps/kira-studio/frontend/src/bridge/*.ts import them directly; the two caches above make this a no-op on a hit — setup.sh still validates the cached wails3 binary against go.mod's pinned version/toolchain before trusting it)
        run: sh scripts/setup.sh
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Go compile check, every package (darwin build-tag breaks caught here even though the test run below is scoped)
        run: go build ./...
      - name: Go unit tests, darwin-relevant packages only (v1.4 P1 — container-tests already runs the full ./... on Linux with Docker, covering every non-container case here too, so a macOS-only full run was pure duplication; these five have real darwin&&cgo test/implementation files — secrets, metrics, localauth, gitclient, datagrip)
        run: |
          go test \
            ./apps/kira-studio/internal/secrets/... \
            ./apps/kira-studio/internal/metrics/... \
            ./apps/kira-studio/internal/localauth/... \
            ./apps/kira-studio/internal/gitclient \
            ./apps/kira-studio/internal/datagrip/...
      - run: bun run verify:packaging

  # Builds and caches the Linux wails3 CLI once, so `ui` and `container-tests` — both ubuntu-latest,
  # both otherwise independent of each other — don't race to `go install` the same binary in
  # parallel on a go.mod-hash cache miss. Their own "Cache wails3 CLI"/"Cache generated Wails
  # bindings" steps still run (a job's cache isn't visible until restored on that job's own runner),
  # but land as cache hits instead of rebuilding.
  wails-linux-cli:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install & cache GTK4/WebKitGTK headers (wails3 CLI build requirement on Linux — CLAUDE.md)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          version: 1.0
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - name: Generate Wails bindings
        run: sh scripts/setup.sh

  ui:
    needs: [checks, wails-linux-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install & cache GTK4/WebKitGTK headers (wails3 CLI build requirement on Linux — CLAUDE.md)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          version: 1.0
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - name: Generate Wails bindings
        run: sh scripts/setup.sh
      - name: Cache Playwright browsers (keyed on the lockfile, which pins the @playwright/test version)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Install WebKit and its system libraries (CLAUDE.md)
        run: bunx playwright install webkit
      - name: Install & cache WebKit's runtime libraries (CLAUDE.md)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libevent-2.1-7t64 libgstreamer-plugins-bad1.0-0 libflite1 gstreamer1.0-libav libavif16
          version: 1.0
      - run: bun run test:ui
      - name: IPC frontend tests (v1.4 P1 — previously in no CI job; consumes the fixtures internal/adapters/*'s own suites generate, closing the anti-drift gap)
        run: bun run test:ipc:fe
      - name: Visual regression tests (v1.4 P6 — bounded pixel-diff tier, docs/v1.4/plans/P6-visual-regression.md; baselines are only ever captured/updated from this job's own environment, see tests/visual/README.md)
        run: bun run test:visual
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  container-tests:
    needs: [checks, wails-linux-cli]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Restore cached Testcontainers images (keyed on the pinned image tags, so an unchanged adapter-test image set skips re-pulling)
        id: docker-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('apps/kira-studio/internal/adapters/testsupport/*.go') }}
      - name: Load cached Testcontainers images
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i ~/docker-images.tar
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install & cache GTK4/WebKitGTK headers (wails3 CLI build requirement on Linux — CLAUDE.md)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          version: 1.0
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - name: Generate Wails bindings
        run: sh scripts/setup.sh
      - run: bun run test:unit
      - name: Raise the inotify instance limit (v1.4 P1 — internal/gitsock and internal/gitsession now run t.Parallel(); each open repo holds one fsnotify watcher = one inotify instance, and Ubuntu's stock 128 is low enough for the parallel suite to exhaust it and hang rather than fail cleanly, confirmed by reproducing the hang at 128 and it clearing at 8192)
        run: sudo sysctl -w fs.inotify.max_user_instances=8192
      - name: Go adapter tests against real Testcontainers (Docker is available on this runner)
        run: bun run test:go
      - name: Save pulled Testcontainers images (always() so a partial pull from a failed run still seeds the next one)
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        run: docker save $(docker images -q) -o ~/docker-images.tar
      - name: Cache pulled Testcontainers images
        if: always() && steps.docker-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/docker-images.tar
          key: docker-${{ runner.os }}-${{ hashFiles('apps/kira-studio/internal/adapters/testsupport/*.go') }}

  package-smoke:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Cache bun install (keyed on the lockfile, so an unchanged dependency set skips re-download)
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Cache wails3 CLI (v1.4 P1 — go.mod-keyed, OS-specific binary)
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings (v1.4 P1 — platform-independent output, shared across OSes)
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - run: bun run package
      - name: Assert packaged bundle and disk image (docs/PACKAGING.md §4)
        run: |
          set -eu
          APP="apps/kira-studio/bin/Kira Studio.app"
          DMG="apps/kira-studio/bin/Kira Studio.dmg"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" \
            = 'com.kirathecat.kira-studio'
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          # P10 ships the .dmg, so the smoke job opens the real thing: the image mounts, the app
          # is inside it, and so is the /Applications shortcut the install gesture needs.
          test -f "$DMG"
          codesign -dv --verbose=2 "$DMG" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/kira-dmg "$DMG"
          test -d "/tmp/kira-dmg/Kira Studio.app"
          test -L "/tmp/kira-dmg/Applications"
          hdiutil detach /tmp/kira-dmg
          du -sh "$APP" "$DMG"
      - run: bun run verify:packaging
