<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Kira Studio app icon</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D2A97C"/>
      <stop offset="1" stop-color="#A3794C"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#EDCFA6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#EDCFA6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="iris" cx="0.5" cy="0.42" r="0.65">
      <stop offset="0" stop-color="#C6CFA6"/>
      <stop offset="1" stop-color="#8FA077"/>
    </radialGradient>
    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <clipPath id="headClip">
      <ellipse cx="512" cy="390" rx="175" ry="150"/>
      <path d="M 350 318 Q 346 198 396 126 Q 466 178 502 258 Q 424 300 350 318 Z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#glow)"/>

    <!-- oversized client glyphs, layered BEHIND the cat -->
    <g stroke="#6B4A2B" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
      <!-- document braces (bottom-left, behind the body) -->
      <g transform="translate(310 655) rotate(-8) scale(2.4)" fill="none" stroke-width="5.5">
        <path d="M -12 -34 C -26 -34 -28 -24 -28 -14 C -28 -4 -34 0 -40 0 C -34 0 -28 4 -28 14 C -28 24 -26 34 -12 34"/>
        <path d="M 12 -34 C 26 -34 28 -24 28 -14 C 28 -4 34 0 40 0 C 34 0 28 4 28 14 C 28 24 26 34 12 34"/>
      </g>
      <!-- message queue (top-right, first message tucks behind ear) -->
      <g transform="translate(750 240) rotate(8)">
        <rect x="-130" y="-32" width="64" height="64" rx="14" fill="#F1E4CC"/>
        <rect x="-46" y="-32" width="64" height="64" rx="14" fill="#F1E4CC"/>
        <rect x="38" y="-32" width="64" height="64" rx="14" fill="#F1E4CC"/>
        <path d="M 112 0 L 142 0" fill="none"/>
        <path d="M 128 -15 L 143 0 L 128 15" fill="none"/>
      </g>
      <!-- database stack (top-left, tucks behind head) -->
      <g transform="translate(290 315) rotate(-6)">
        <rect x="-95" y="-100" width="190" height="52" rx="26" fill="#F1E4CC"/>
        <rect x="-95" y="-26" width="190" height="52" rx="26" fill="#F1E4CC"/>
        <rect x="-95" y="48" width="190" height="52" rx="26" fill="#F1E4CC"/>
      </g>
      <!-- sql cell grid (bottom-right, behind body and tail) -->
      <g transform="translate(700 645) rotate(6)">
        <rect x="-105" y="-88" width="210" height="176" rx="20" fill="#F1E4CC"/>
        <rect x="-35" y="-29" width="70" height="58" fill="#D9B36A" stroke="none"/>
        <path d="M -105 -29 L 105 -29 M -105 29 L 105 29 M -35 -88 L -35 88 M 35 -88 L 35 88" fill="none" stroke-width="10"/>
      </g>
      <!-- sparkles in the gaps -->
      <g fill="#F6EDDC" stroke="none">
        <path transform="translate(512 148)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(180 472) scale(0.9)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(866 476) scale(1.1)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(600 162) scale(0.7)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(160 195) scale(0.8)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(885 355) scale(0.7)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(160 810) scale(0.75)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
        <path transform="translate(860 845) scale(0.8)" d="M 0 -14 L 3.5 -3.5 L 14 0 L 3.5 3.5 L 0 14 L -3.5 3.5 L -14 0 L -3.5 -3.5 Z"/>
      </g>
    </g>

    <g transform="translate(512 512) scale(0.92) translate(-512 -512)">
      <!-- ground shadow -->
      <ellipse cx="530" cy="886" rx="250" ry="40" fill="#000000" opacity="0.12"/>

      <!-- tail -->
      <path d="M 620 832 C 776 886 872 842 886 742" fill="none"
            stroke="#3E3E42" stroke-width="62" stroke-linecap="round"/>

      <!-- body -->
      <path d="M 404 478
               C 384 540 378 610 380 682
               C 362 712 352 758 350 804
               C 348 856 378 884 420 884
               L 604 884
               C 646 884 676 856 674 804
               C 672 758 662 712 644 682
               C 646 610 640 540 620 478
               C 586 448 438 448 404 478 Z" fill="#FDFDFB"/>
      <!-- body side shading -->
      <g fill="none" stroke="#EDE7DD" stroke-width="14" stroke-linecap="round" opacity="0.8">
        <path d="M 402 502 C 388 556 384 616 384 668"/>
        <path d="M 622 502 C 636 556 640 616 640 668"/>
        <path d="M 382 694 C 368 724 360 764 358 804"/>
        <path d="M 642 694 C 656 724 664 764 666 804"/>
      </g>

      <!-- grey patch on left foreleg/side -->
      <ellipse cx="420" cy="705" rx="46" ry="55" fill="#8B8B90" transform="rotate(-12 420 705)"/>

      <!-- front legs -->
      <rect x="446" y="600" width="64" height="270" rx="30" fill="#FDFDFB"/>
      <rect x="516" y="600" width="64" height="270" rx="30" fill="#FDFDFB"/>
      <g fill="none" stroke="#E9E3D9" stroke-width="6" stroke-linecap="round">
        <path d="M 446 640 C 442 720 442 800 452 858"/>
        <path d="M 580 640 C 584 720 584 800 574 858"/>
        <path d="M 513 646 L 513 852" stroke="#E4DDD2"/>
      </g>

      <!-- paws -->
      <ellipse cx="474" cy="872" rx="50" ry="30" fill="#FDFDFB"/>
      <ellipse cx="554" cy="872" rx="50" ry="30" fill="#FDFDFB"/>
      <g fill="none" stroke="#E4DDD2" stroke-width="5" stroke-linecap="round">
        <path d="M 462 892 L 462 874"/>
        <path d="M 486 896 L 486 876"/>
        <path d="M 542 896 L 542 876"/>
      </g>
      <!-- grey toe on right paw -->
      <ellipse cx="566" cy="884" rx="20" ry="15" fill="#8B8B90"/>

      <!-- ears -->
      <path d="M 350 318 Q 346 198 396 126 Q 466 178 502 258 Q 424 300 350 318 Z" fill="#FDFDFB"/>
      <path d="M 674 318 Q 678 198 628 126 Q 558 178 522 258 Q 600 300 674 318 Z" fill="#FDFDFB"/>

      <!-- head -->
      <ellipse cx="512" cy="390" rx="175" ry="150" fill="#FDFDFB"/>

      <!-- grey patch over left ear and brow -->
      <g clip-path="url(#headClip)">
        <path d="M 332 380
                 C 326 300 348 210 396 142
                 C 428 176 462 224 484 272
                 C 512 300 518 334 500 366
                 C 466 402 396 416 332 380 Z" fill="#8E8E93"/>
        <g fill="none" stroke="#74747A" stroke-width="6" stroke-linecap="round" opacity="0.55">
          <path d="M 382 340 Q 418 302 438 262"/>
          <path d="M 352 352 Q 392 330 418 298"/>
        </g>
      </g>

      <!-- inner ears -->
      <path d="M 386 288 Q 390 210 406 166 Q 444 204 466 254 Q 428 276 386 288 Z" fill="#C9AAB0"/>
      <path d="M 638 288 Q 634 210 618 166 Q 580 204 558 254 Q 596 276 638 288 Z" fill="#F2C4C0"/>

      <!-- eyes -->
      <g>
        <circle cx="442" cy="398" r="48" fill="url(#iris)" stroke="#75835F" stroke-width="3"/>
        <circle cx="582" cy="398" r="48" fill="url(#iris)" stroke="#75835F" stroke-width="3"/>
        <circle cx="442" cy="400" r="26" fill="#1C1C1E"/>
        <circle cx="582" cy="400" r="26" fill="#1C1C1E"/>
        <circle cx="430" cy="384" r="9" fill="#FFFFFF" opacity="0.92"/>
        <circle cx="570" cy="384" r="9" fill="#FFFFFF" opacity="0.92"/>
        <circle cx="452" cy="412" r="4.5" fill="#FFFFFF" opacity="0.55"/>
        <circle cx="592" cy="412" r="4.5" fill="#FFFFFF" opacity="0.55"/>
      </g>

      <!-- nose and mouth -->
      <path d="M 490 447 Q 512 438 534 447 Q 528 468 512 474 Q 496 468 490 447 Z" fill="#E9A9AC"/>
      <g fill="none" stroke="#CFC4BD" stroke-width="5" stroke-linecap="round">
        <path d="M 512 474 L 512 492"/>
        <path d="M 512 492 Q 494 506 478 496"/>
        <path d="M 512 492 Q 530 506 546 496"/>
      </g>

      <!-- whiskers -->
      <g fill="none" stroke="#FFF9EE" stroke-width="4" stroke-linecap="round" opacity="0.75">
        <path d="M 452 470 Q 360 460 298 444"/>
        <path d="M 450 486 Q 354 490 294 492"/>
        <path d="M 454 500 Q 366 520 312 538"/>
        <path d="M 572 470 Q 664 460 726 444"/>
        <path d="M 574 486 Q 670 490 730 492"/>
        <path d="M 570 500 Q 658 520 712 538"/>
      </g>
    </g>
  </g>
</svg>
