<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-chrome: #181818; --bg-elevated: #202020; --bg-input: #313131;
      --fg: #cccccc; --fg-muted: #9d9d9d; --fg-disabled: #6e6e6e;
      --border: #2b2b2b; --border-strong: #3c3c3c; --focus: #0078d4;
      --accent: #0078d4; --accent-fg: #ffffff; --select: #04395e;
      --ok: #23d18b; --warn: #cca700;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; color: var(--fg); -webkit-font-smoothing: antialiased;
      background: var(--bg-chrome);
      display: flex; align-items: center; justify-content: center;
    }
    .icon { width: 14px; height: 14px; display: block; flex-shrink: 0; }
    .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.5); display: flex; align-items: center; justify-content: center; }

    .dialog { width: 480px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.45); overflow: hidden; }
    .dialog-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .title-close { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--fg-muted); }
    .title-close:hover { background: #ffffff14; color: var(--fg); }

    .dialog-body { padding: 12px; display: flex; flex-direction: column; gap: 12px; max-height: 520px; overflow: auto; }
    .row { display: flex; gap: 8px; }
    .field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 0; }
    .field label { font-size: 11px; color: var(--fg-muted); }
    .field input {
      height: 24px; background: var(--bg-input); border: 1px solid var(--border-strong);
      border-radius: 4px; color: var(--fg); padding: 0 7px; font: inherit;
    }
    .field input:focus { outline: 1px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
    .field.name { flex: 1.6; }
    .field.port { flex: 0 0 90px; }
    .helper { font-size: 11px; color: var(--fg-disabled); }

    .colors { display: flex; gap: 6px; align-items: center; height: 24px; }
    .swatch { width: 15px; height: 15px; border-radius: 50%; cursor: pointer; }
    .swatch.picked { box-shadow: 0 0 0 2px var(--bg-elevated), 0 0 0 3px currentColor; }

    .fake-select { height: 24px; background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 7px; display: flex; align-items: center; justify-content: space-between; color: var(--fg); }
    .fake-select svg { color: var(--fg-muted); }

    .seg { display: flex; border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; width: fit-content; }
    .seg button { padding: 4px 16px; background: var(--bg-input); border: none; border-right: 1px solid var(--border-strong); color: var(--fg-muted); font: inherit; cursor: pointer; }
    .seg button:last-child { border-right: none; }
    .seg button.active { background: var(--select); color: var(--fg); }

    .pw-row { display: flex; align-items: stretch; height: 24px; background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: 4px; }
    .pw-row input { flex: 1; background: transparent; border: none; padding: 0 7px; color: var(--fg); font: inherit; }
    .pw-row input:focus { outline: none; }
    .pw-eye { width: 26px; display: flex; align-items: center; justify-content: center; color: var(--fg-muted); border-left: 1px solid var(--border-strong); cursor: pointer; }

    .checkbox-row { display: flex; align-items: flex-start; gap: 8px; }
    .checkbox { width: 14px; height: 14px; border: 1px solid var(--border-strong); border-radius: 4px; margin-top: 1px; flex-shrink: 0; }
    .checkbox-text { display: flex; flex-direction: column; gap: 2px; }

    .warning { display: flex; align-items: center; gap: 6px; color: var(--fg-disabled); font-size: 11px; padding-top: 2px; border-top: 1px solid var(--border); }

    .dialog-footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-top: 1px solid var(--border); }
    .test-area { display: flex; align-items: center; gap: 8px; }
    .btn { height: 25px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--bg-input); color: var(--fg); font: inherit; cursor: pointer; display: flex; align-items: center; gap: 6px; }
    .btn:hover { background: #3a3a3a; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
    .btn.primary:hover { background: #1a86dd; }
    .footer-actions { display: flex; gap: 8px; }
    .chip-ok { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 10px; background: #1c3d2c; color: var(--ok); font-size: 11px; }
  </style>
</helmet>

<svg style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 16 16"><path d="M3.5 6L8 10.5L12.5 6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.2"/></symbol>
    <symbol id="i-plug" viewBox="0 0 16 16"><path d="M6 2.5v3M10 2.5v3M4 5.5h8v2.7A4 4 0 0 1 8 12.2 4 4 0 0 1 4 8.2V5.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 12.2v1.3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></symbol>
    <symbol id="i-check" viewBox="0 0 16 16"><path d="M3.5 8.3l3 3 6-6.6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warn" viewBox="0 0 16 16"><path d="M8 2.3L14.5 13H1.5Z" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6.3v3.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="8" cy="11.3" r="0.6" fill="currentColor"/></symbol>
  </defs>
</svg>

<div class="scrim">
  <div class="dialog">
    <div class="dialog-title">
      <span>New Connection</span>
      <span class="title-close"><svg class="icon"><use href="#i-close"/></svg></span>
    </div>

    <div class="dialog-body">
      <div class="row">
        <div class="field name">
          <label>Name</label>
          <input value="prod-analytics" />
        </div>
        <div class="field">
          <label>Color</label>
          <div class="colors">
            <span class="swatch" style="background:#c75450"></span>
            <span class="swatch" style="background:#cc7832"></span>
            <span class="swatch" style="background:#bfa23a"></span>
            <span class="swatch" style="background:#91a93e"></span>
            <span class="swatch" style="background:#499c54"></span>
            <span class="swatch" style="background:#2aa198"></span>
            <span class="swatch" style="background:#3592c4"></span>
            <span class="swatch picked" style="background:#4b7bec; color:#4b7bec"></span>
            <span class="swatch" style="background:#6c71c4"></span>
            <span class="swatch" style="background:#9876aa"></span>
            <span class="swatch" style="background:#c066b0"></span>
            <span class="swatch" style="background:#6e7681"></span>
          </div>
        </div>
      </div>

      <div class="field">
        <label>Kind</label>
        <div class="fake-select"><span>PostgreSQL</span><svg class="icon"><use href="#i-chevron-down"/></svg></div>
      </div>

      <div class="field">
        <label>Mode</label>
        <div class="seg">
          <button class="active">Fields</button>
          <button>URI</button>
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Host</label>
          <input value="10.0.4.8" />
        </div>
        <div class="field port">
          <label>Port</label>
          <input value="5432" />
        </div>
      </div>

      <div class="field">
        <label>Database</label>
        <input value="analytics" />
      </div>

      <div class="field">
        <label>User</label>
        <input value="kira_ro" />
      </div>

      <div class="field">
        <label>Password</label>
        <div class="pw-row">
          <input value="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" />
          <span class="pw-eye"><svg class="icon"><use href="#i-eye"/></svg></span>
        </div>
      </div>

      <div class="checkbox-row">
        <span class="checkbox"></span>
        <div class="checkbox-text">
          <span>Read-only</span>
          <span class="helper">Blocks every mutation path for this connection.</span>
        </div>
      </div>

      <div class="warning">
        <svg class="icon" style="color:var(--warn)"><use href="#i-warn"/></svg>
        <span>Credentials are stored unencrypted in ~/.kira-studio/kira.sqlite.</span>
      </div>
    </div>

    <div class="dialog-footer">
      <div class="test-area">
        <button class="btn"><svg class="icon"><use href="#i-plug"/></svg>Test connection</button>
        <span class="chip-ok"><svg class="icon" style="width:11px;height:11px"><use href="#i-check"/></svg>OK &mdash; 41ms</span>
      </div>
      <div class="footer-actions">
        <button class="btn">Cancel</button>
        <button class="btn primary">Save</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
