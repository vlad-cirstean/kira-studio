<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    :root {
      --bg-chrome: #181818; --bg-elevated: #202020; --bg-input: #313131;
      --fg: #cccccc; --fg-muted: #9d9d9d; --fg-disabled: #6e6e6e;
      --border: #2b2b2b; --border-strong: #3c3c3c; --focus: #0078d4;
      --accent: #0078d4; --accent-fg: #ffffff; --select: #04395e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 12px; color: var(--fg); -webkit-font-smoothing: antialiased;
      background: var(--bg-chrome);
      display: flex; align-items: center; justify-content: center;
    }
    .icon { width: 14px; height: 14px; display: block; flex-shrink: 0; }
    .scrim { position: absolute; inset: 0; background: rgb(0 0 0 / 0.5); display: flex; align-items: center; justify-content: center; }

    .dialog { width: 620px; height: 440px; background: var(--bg-elevated); border: 1px solid var(--border-strong); border-radius: 8px; box-shadow: 0 8px 28px rgb(0 0 0 / 0.45); display: flex; flex-direction: column; overflow: hidden; }
    .dialog-title { display: flex; align-items: center; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); font-weight: 600; }
    .title-close { width: 20px; height: 20px; display: flex; align-items: center; justify-content: center; border-radius: 4px; color: var(--fg-muted); }
    .title-close:hover { background: #ffffff14; color: var(--fg); }

    .dialog-body { flex: 1; min-height: 0; display: flex; }
    .nav { width: 160px; flex-shrink: 0; border-right: 1px solid var(--border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-item { padding: 6px 12px; border-radius: 4px; color: var(--fg-muted); cursor: pointer; }
    .nav-item:hover:not(.active) { background: var(--hover); color: var(--fg); }
    .nav-item.active { background: var(--select); color: var(--fg); }

    .pane { flex: 1; min-width: 0; padding: 12px 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 4px; max-width: 340px; }
    .field label { font-size: 11px; color: var(--fg-muted); }
    .field input { height: 24px; background: var(--bg-input); border: 1px solid var(--border-strong); border-radius: 4px; color: var(--fg); padding: 0 7px; font: inherit; }
    .field input:focus { outline: 1px solid var(--focus); outline-offset: -1px; border-color: var(--focus); }
    .field .preview { color: var(--fg-disabled); font-size: 11px; }

    .seg { display: flex; border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; width: fit-content; }
    .seg button { padding: 4px 14px; background: var(--bg-input); border: none; border-right: 1px solid var(--border-strong); color: var(--fg-muted); font: inherit; cursor: pointer; }
    .seg button:last-child { border-right: none; }
    .seg button.active { background: var(--select); color: var(--fg); }

    .dialog-footer { display: flex; justify-content: flex-end; padding: 8px 12px; border-top: 1px solid var(--border); }
    .btn { height: 25px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--border-strong); background: var(--bg-input); color: var(--fg); font: inherit; cursor: pointer; }
    .btn:hover { background: #3a3a3a; }
  </style>
</helmet>

<svg style="display:none" aria-hidden="true">
  <defs>
    <symbol id="i-close" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></symbol>
  </defs>
</svg>

<div class="scrim">
  <div class="dialog">
    <div class="dialog-title">
      <span>Settings</span>
      <span class="title-close"><svg class="icon"><use href="#i-close"/></svg></span>
    </div>

    <div class="dialog-body">
      <div class="nav">
        <div class="nav-item active">Appearance</div>
        <div class="nav-item">Data</div>
        <div class="nav-item">Cache</div>
        <div class="nav-item">Advanced</div>
      </div>

      <div class="pane">
        <div class="field">
          <label>Font family</label>
          <input value="&#39;SF Mono&#39;, Menlo, monospace" />
        </div>
        <div class="field">
          <label>Font size</label>
          <input value="12" style="width:80px" />
        </div>
        <div class="field">
          <label>Row density</label>
          <div class="seg">
            <button>Compact</button>
            <button class="active">Comfortable</button>
          </div>
        </div>
      </div>
    </div>

    <div class="dialog-footer">
      <button class="btn">Close</button>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
