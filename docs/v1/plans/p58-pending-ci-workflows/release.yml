name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile

      - name: Set package.json version from the release tag
        run: |
          set -eu
          TAG="${GITHUB_REF_NAME#v}"
          node -e "
            const fs = require('node:fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = process.argv[1];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          " "$TAG"
          echo "package.json version set to $TAG (from tag $GITHUB_REF_NAME)"

      - name: Generate Wails bindings (P57 D8/D13)
        run: |
          set -eu
          PINNED_VERSION="$(grep -m1 'github.com/wailsapp/wails/v3 ' go.mod | awk '{print $2}')"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$PINNED_VERSION"
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd apps/kira-studio && wails3 generate bindings -b -i -ts -names)

      - run: bun run lint
      - run: bun run typecheck

      - run: bun run package

      - name: Zip the signed app bundle for distribution
        run: ditto -c -k --keepParent "apps/kira-studio/bin/Kira Studio.app" "kira-studio-macos-arm64.zip"

      - name: Verify packaging
        run: bun run verify:packaging

      - name: Compose release notes
        run: |
          cat > release-notes.md <<'EOF'
          Unsigned (ad-hoc), local, arm64-only macOS build — macOS 13+. See docs/PACKAGING.md
          and README.md for details.

          Since this build is unsigned, macOS Gatekeeper will block the first launch. Either
          right-click the app and choose Open, or run:

              xattr -dr com.apple.quarantine "/Applications/Kira Studio.app"

          This release has no auto-update. The artifact below carries no update metadata or feed
          — see docs/PACKAGING.md §7 for why, and what would need to change first.
          EOF

      - name: Create draft release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "Kira Studio $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            kira-studio-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: kira-studio-macos-arm64
          path: kira-studio-macos-arm64.zip
          retention-days: 14
