# Report-only mutation testing (P151). Copy to .github/workflows/mutation.yml from an environment
# whose push credential has the `workflow` scope, then delete this file in the same commit.
# Manual trigger only: never push/PR, never a required check, never gates anything.
name: Mutation (report-only)

on:
  workflow_dispatch:
    inputs:
      lang:
        description: Which language to mutate
        type: choice
        options: [go, ts, all]
        default: all
      changed_ref:
        description: Optional git ref; mutate only files changed since it (empty = whole scope)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mutation
  cancel-in-progress: false

jobs:
  go:
    name: mutation go
    if: inputs.lang == 'go' || inputs.lang == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install & cache GTK4/WebKitGTK headers (Go packages importing wails need them on Linux)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          version: 1.0
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - name: Mutate Go packages
        run: sh scripts/mutation/run.sh go ${{ inputs.changed_ref && format('--changed {0}', inputs.changed_ref) || '' }}
      - name: Publish summary
        if: always()
        run: cat tools/mutation/out/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-go
          path: tools/mutation/out/
          retention-days: 14

  ts:
    name: mutation ts
    if: inputs.lang == 'ts' || inputs.lang == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install & cache GTK4/WebKitGTK headers (wails3 CLI build requirement on Linux)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
          version: 1.0
      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - name: Cache wails3 CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin/wails3
          key: wails3-${{ runner.os }}-${{ hashFiles('go.mod') }}
      - name: Cache generated Wails bindings
        uses: actions/cache@v4
        with:
          path: |
            apps/kira-studio/frontend/bindings
            apps/kira-studio/.task
          key: wails-bindings-${{ hashFiles('go.mod') }}
      - name: Install deps and generate Wails bindings
        run: sh scripts/setup.sh
      - name: Mutate TS areas
        run: sh scripts/mutation/run.sh ts ${{ inputs.changed_ref && format('--changed {0}', inputs.changed_ref) || '' }}
      - name: Publish summary
        if: always()
        run: cat tools/mutation/out/latest/summary.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-ts
          path: tools/mutation/out/
          retention-days: 14
