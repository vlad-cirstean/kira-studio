name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      - name: Generate Wails bindings (P57 D8/D13 — src/renderer/bridge/*.ts import them directly)
        run: |
          set -eu
          PINNED_VERSION="$(grep -m1 'github.com/wailsapp/wails/v3 ' go.mod | awk '{print $2}')"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$PINNED_VERSION"
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd apps/kira-studio && wails3 generate bindings -b -i -ts -names)
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run build
      - name: Go unit tests (container-backed cases skip themselves without Docker — see container-tests)
        run: bun run test:go
      - run: bun run verify:packaging

  ui:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install GTK4/WebKitGTK headers (wails3 CLI build requirement on Linux — AGENTS.md)
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: bun install --frozen-lockfile
      - name: Generate Wails bindings
        run: |
          set -eu
          PINNED_VERSION="$(grep -m1 'github.com/wailsapp/wails/v3 ' go.mod | awk '{print $2}')"
          go install "github.com/wailsapp/wails/v3/cmd/wails3@$PINNED_VERSION"
          export PATH="$PATH:$(go env GOPATH)/bin"
          (cd apps/kira-studio && wails3 generate bindings -b -i -ts -names)
      - name: Install WebKit and its system libraries (AGENTS.md)
        run: |
          bunx playwright install webkit
          sudo apt-get install -y libevent-2.1-7t64 libgstreamer-plugins-bad1.0-0 libflite1 gstreamer1.0-libav
      - run: bun run test:ui
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  container-tests:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
      - name: Go adapter tests against real Testcontainers (Docker is available on this runner)
        run: bun run test:go

  package-smoke:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: bun install --frozen-lockfile
      - run: bun run package
      - name: Assert packaged bundle and disk image (docs/PACKAGING.md §4)
        run: |
          set -eu
          APP="apps/kira-studio/bin/Kira Studio.app"
          DMG="apps/kira-studio/bin/Kira Studio.dmg"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Contents/Info.plist")" \
            = 'com.kirathecat.kira-studio'
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -q 'Signature=adhoc'
          # P10 ships the .dmg, so the smoke job opens the real thing: the image mounts, the app
          # is inside it, and so is the /Applications shortcut the install gesture needs.
          test -f "$DMG"
          codesign -dv --verbose=2 "$DMG" 2>&1 | grep -q 'Signature=adhoc'
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/kira-dmg "$DMG"
          test -d "/tmp/kira-dmg/Kira Studio.app"
          test -L "/tmp/kira-dmg/Applications"
          hdiutil detach /tmp/kira-dmg
          du -sh "$APP" "$DMG"
      - run: bun run verify:packaging
