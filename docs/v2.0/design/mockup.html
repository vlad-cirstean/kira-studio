<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent merge queue — mockup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#121316;font-family:"IBM Plex Sans",system-ui,sans-serif;color:#e8e6e1}
button,textarea,input{font-family:inherit}
a{color:#93b6ff;text-decoration:none}a:hover{text-decoration:underline}
.aq-rt{outline:none}
.aq-rt:empty:before{content:attr(data-placeholder);color:#6b6f7a}
.aq-rt h3{font-size:14px;font-weight:700;margin:6px 0 2px;color:#e8e6e1}
.aq-rt p,.aq-rt div{margin:0 0 2px}
.aq-rt ul,.aq-rt ol{margin:2px 0;padding-left:22px}
.aq-rt li{margin:1px 0}
.aq-rt code{font-family:'IBM Plex Mono',monospace;font-size:12px;padding:0 4px;border-radius:4px;background:#23252b;color:#f0b85c}
.aq-rt ul[data-tasks]{list-style:none;padding-left:4px}
.aq-rt ul[data-tasks] li{position:relative;padding-left:24px}
.aq-rt ul[data-tasks] li:before{content:'';position:absolute;left:0;top:3px;width:13px;height:13px;border-radius:3px;border:1.5px solid #5c606b;box-sizing:border-box;cursor:pointer}
.aq-rt ul[data-tasks] li[data-done="1"]{color:#7c7f88;text-decoration:line-through}
.aq-rt ul[data-tasks] li[data-done="1"]:before{content:'✓';background:#6cc58a;border-color:#6cc58a;color:#15161a;font-size:10px;font-weight:800;line-height:13px;text-align:center}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.21/vue.global.prod.min.js"></script>
</head>
<body>
<div id="app">
<div id="aq-root" @click="V.rootClick" style="position: relative; width: 1440px; height: 900px; box-sizing: border-box; display: flex; flex-direction: column; background: #121316; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #e8e6e1; overflow: hidden;">

  <nav style="height: 40px; flex-shrink: 0; display: flex; align-items: stretch; background: #0e0f12; border-bottom: 1px solid #2a2d35; padding-left: 8px;">
    <template v-for="(rt, _i_rt) in V.repoTabs" :key="_i_rt">
      <button @click="rt.pick" :style="rt.style">
        <template v-if="rt.pinned">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
        </template>
        <template v-for="(ac, _i_ac) in rt.acts" :key="_i_ac">
          <span :title="ac.title" style="display: inline-flex; align-items: center; gap: 3px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #c9c7c2;"><span :style="ac.style">{{ ac.glyph }}</span>{{ ac.count }}</span>
        </template>
        <span style="max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ rt.label }}</span>
      </button>
    </template>
  </nav>

  <template v-if="V.isAll">
    <div style="flex-grow: 1; min-height: 0; overflow: auto; padding: 18px 28px 28px;">
      <div style="max-width: 1040px; display: flex; flex-direction: column; gap: 18px;">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="display: flex; padding: 3px; border-radius: 8px; background: #1b1d22; border: 1px solid #2a2d35;">
            <button @click="V.allView.showActive" :style="V.allView.activeStyle">{{ V.allView.activeLabel }}</button>
            <button @click="V.allView.showOlder" :style="V.allView.olderStyle">{{ V.allView.olderLabel }}</button>
          </div>
          <div style="display: flex; gap: 12px;">
            <template v-for="(ac, _i_ac) in V.allView.acts" :key="_i_ac">
              <span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #c9c7c2;"><span :style="ac.style">{{ ac.glyph }}</span>{{ ac.title }}</span>
            </template>
          </div>
        </div>
        <template v-for="(g, _i_g) in V.allView.groups" :key="_i_g">
          <section style="display: flex; flex-direction: column; gap: 2px;">
            <div style="padding: 0 12px 6px; border-bottom: 1px solid #22252c; margin-bottom: 4px;">
              <h3 style="margin: 0; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">{{ g.repo }}</h3>
            </div>
            <template v-for="(ar, _i_ar) in g.rows" :key="_i_ar">
              <div :style="ar.rowStyle">
                <span :style="ar.swatch"></span>
                <span :title="ar.state" :style="ar.iconStyle">{{ ar.glyph }}</span>
                <span :style="ar.stateStyle">{{ ar.state }}</span>
                <span style="font-size: 12px; color: #9a9ca5;">{{ ar.last }}</span>
                <button @click="ar.run" :style="ar.btnStyle">{{ ar.btn }}</button>
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #9a9ca5;">claude {{ ar.sid }}</span>
                <div style="display: flex; flex-direction: column; min-width: 0;">
                  <span style="font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ ar.title }}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #7c7f88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ ar.branch }} {{ ar.wt }}</span>
                </div>
              </div>
            </template>
          </section>
        </template>
        <template v-if="V.allView.empty"><div style="font-size: 13px; color: #9a9ca5; padding: 12px;">Nothing here.</div></template>
      </div>
    </div>
  </template>

  <template v-if="V.isRepo">
    <div style="flex-grow: 1; min-height: 0; display: flex;">
      <main id="aq-main" @scroll="V.onMainScroll" @wheel="V.onMainWheel" style="position: relative; flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 0 20px 20px; overflow: auto;">
        <div style="position: sticky; top: 0; z-index: 12; background: #121316; padding-top: 10px;">
          <div style="display: flex; align-items: center; gap: 10px; margin: 0 0 8px 60px; padding-left: 8px;">
            <span style="font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 600;">{{ V.projectName }}</span>
            <span :title="V.fetchLabel" :style="V.fetchLabelStyle">{{ V.fetchLabel }}</span>
            <span style="flex-grow: 1;"></span>
            <button @click="V.doRefresh" :disabled="V.fetchBusy" title="Fetch this project and recheck conflicts" :style="V.refreshStyle">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"></path><path d="M20 4v5h-5"></path></svg>
              {{ V.refreshLabel }}
            </button>
          </div>
          <div style="display: flex;">
            <div style="width: 60px; flex-shrink: 0; box-sizing: border-box; border-right: 2px solid #3a3e48;"></div>
            <div style="flex-grow: 1; min-width: 0; padding: 0 0 8px 218px; display: flex; gap: 8px; position: relative;">
              <div style="flex-grow: 1; min-width: 0; max-width: 560px; height: 30px; box-sizing: border-box; padding: 0 4px 0 12px; border-radius: 8px; background: #1b1d22; border: 1px solid #2f323b; display: flex; align-items: center; gap: 10px;">
                <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; font-weight: 600;">main</span>
                <span :style="V.mainNoteStyle">{{ V.mainNote }}</span>
                <span style="flex-grow: 1;"></span>
                <template v-if="V.mainCanRebase">
                  <button @click="V.rebaseAll" style="height: 22px; flex-shrink: 0; white-space: nowrap; padding: 0 9px; border-radius: 5px; border: none; background: #e8a33d; color: #15161a; font-size: 11px; font-weight: 600; cursor: pointer;">Rebase all</button>
                </template>
              </div>
              <button @click="V.togglePicker" style="height: 30px; flex-shrink: 0; white-space: nowrap; padding: 0 10px; border-radius: 8px; border: 1px solid #3a3e48; background: transparent; color: #e8e6e1; font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>Add</button>
              <template v-if="V.picker.open">
                <div style="position: absolute; left: 218px; top: 36px; width: 440px; box-sizing: border-box; border-radius: 10px; border: 1px solid #3a3e48; background: #1b1d22; box-shadow: 0 16px 40px rgba(0,0,0,0.5); z-index: 20; overflow: hidden;">
                  <div role="tablist" style="display: flex; gap: 2px; padding: 0 8px; border-bottom: 1px solid #2a2d35;">
                    <button role="tab" @click="V.picker.tabNew" :style="V.picker.tabNewStyle">New work</button>
                    <button role="tab" @click="V.picker.tabBranch" :style="V.picker.tabBranchStyle">Existing branch</button>
                  </div>
                  <template v-if="V.picker.isNew">
                    <div style="display: grid; grid-template-columns: 78px minmax(0, 1fr); gap: 8px 10px; align-items: center; padding: 12px; font-size: 12px;">
                      <label for="nw-title" style="color: #9a9ca5;">Title</label>
                      <input id="nw-title" :value="V.picker.nwTitle" @input="V.picker.onTitle" placeholder="What needs doing" style="height: 28px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; border: 1px solid #3a3e48; background: #121316; color: #e8e6e1; font-size: 12px;">
                      <label for="nw-jira" style="color: #9a9ca5;">Jira</label>
                      <input id="nw-jira" :value="V.picker.nwJira" @input="V.picker.onJira" placeholder="paste link or key (optional)" style="height: 28px; box-sizing: border-box; padding: 0 8px; border-radius: 6px; border: 1px solid #3a3e48; background: #121316; color: #e8e6e1; font-family: 'IBM Plex Mono', monospace; font-size: 11px;">
                      <label for="nw-base" style="color: #9a9ca5;">Start from</label>
                      <select id="nw-base" :value="V.picker.nwBase" @input="V.picker.onBase" style="height: 28px; box-sizing: border-box; padding: 0 6px; border-radius: 6px; border: 1px solid #3a3e48; background: #121316; color: #e8e6e1; font-family: 'IBM Plex Mono', monospace; font-size: 11px;">
                        <template v-for="(bo, _i_bo) in V.picker.baseOptions" :key="_i_bo">
                          <option :value="bo.v">{{ bo.l }}</option>
                        </template>
                      </select>
                      <label for="nw-notes" style="color: #9a9ca5; align-self: start; padding-top: 6px;">Notes</label>
                      <textarea id="nw-notes" :value="V.picker.nwNotes" @input="V.picker.onNotes" placeholder="Context for Claude (optional)" style="min-height: 54px; resize: vertical; box-sizing: border-box; padding: 6px 8px; border-radius: 6px; border: 1px solid #3a3e48; background: #121316; color: #e8e6e1; font-size: 12px; line-height: 1.5;"></textarea>
                      <span></span>
                      <div style="display: flex; align-items: center; gap: 10px;">
                        <button @click="V.picker.addNew" :disabled="V.picker.cantAdd" :style="V.picker.addStyle">Add to Later</button>
                        <span style="font-size: 11px; color: #7c7f88;">No branch yet. Claude creates it on Start.</span>
                      </div>
                    </div>
                  </template>
                  <template v-if="V.picker.isBranch">
                    <label for="branch-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search branches</label>
                    <input id="branch-search" :value="V.picker.q" @input="V.picker.onQ" placeholder="Search branches…" style="width: 100%; height: 36px; box-sizing: border-box; padding: 0 12px; border: none; border-bottom: 1px solid #2a2d35; background: transparent; color: #e8e6e1; font-size: 12px; outline: none;">
                    <div style="max-height: 280px; overflow: auto; padding: 4px;">
                      <template v-for="(pi, _i_pi) in V.picker.items" :key="_i_pi">
                        <button @click="pi.add" style="width: 100%; height: 36px; box-sizing: border-box; padding: 0 8px; border: none; border-radius: 6px; background: transparent; color: #e8e6e1; display: flex; align-items: center; gap: 8px; cursor: pointer; text-align: left;">
                          <span style="font-size: 11px; color: #9a9ca5; width: 52px; flex-shrink: 0;">{{ pi.ago }}</span>
                          <span :style="pi.whoStyle">{{ pi.who }}</span>
                          <span style="font-family: 'IBM Plex Mono', monospace; font-size: 12px; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ pi.name }}</span>
                        </button>
                      </template>
                      <template v-if="V.picker.empty"><div style="padding: 10px; font-size: 12px; color: #9a9ca5;">No branches</div></template>
                    </div>
                  </template>
                </div>
              </template>
            </div>
          </div>
          <template v-if="V.inHistory">
            <div style="display: flex; align-items: center; gap: 10px; margin: 0 0 6px 60px; padding: 6px 10px; border-radius: 8px; background: #1b1d22; border: 1px solid #2f323b; font-size: 12px;">
              <span style="font-weight: 600;">History</span>
              <label for="go-date" style="color: #9a9ca5;">Go to</label>
              <input id="go-date" type="date" @input="V.goToDate" style="height: 24px; box-sizing: border-box; padding: 0 6px; border-radius: 5px; border: 1px solid #3a3e48; background: transparent; color: #c9c7c2; font-size: 11px; color-scheme: dark;">
              <span style="flex-grow: 1;"></span>
              <button @click="V.hideHistory" style="height: 24px; padding: 0 10px; border-radius: 5px; border: 1px solid #3a3e48; background: transparent; color: #c9c7c2; font-size: 11px; cursor: pointer;">Hide history</button>
              <button @click="V.backToToday" style="height: 24px; padding: 0 10px; border-radius: 5px; border: none; background: #e8a33d; color: #15161a; font-size: 11px; font-weight: 600; cursor: pointer;">Current work ↓</button>
            </div>
          </template>
        </div>

        <template v-if="V.showPull">
          <button @click="V.openHistory" style="position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; width: calc(100% - 60px); margin: 2px 0 10px 60px; height: 28px; border-radius: 6px; border: 1px dashed #3a3e48; background: transparent; color: #9a9ca5; font-size: 11px; cursor: pointer;">
            <span :style="V.pullBar"></span>
            <span style="position: relative;">↑</span>
            <span style="position: relative;">{{ V.pullText }}</span>
          </button>
        </template>
        <template v-for="(band, _i_band) in V.bands" :key="_i_band">
          <template v-if="band.isLater">
            <div style="display: flex;">
              <div style="width: 60px; flex-shrink: 0; box-sizing: border-box; border-right: 2px solid #3a3e48; padding: 4px 10px 8px 0;"></div>
              <div style="display: flex; align-items: center; gap: 8px; padding: 4px 0 8px 8px;">
                <button @click="V.dayCtl.moreWeek" style="height: 22px; padding: 0 8px; border-radius: 5px; border: 1px dashed #3a3e48; background: transparent; color: #9a9ca5; font-size: 11px; cursor: pointer;">+ week</button>
                <label for="add-day" style="font-size: 11px; color: #9a9ca5;">or date</label>
                <input id="add-day" type="date" :min="V.dayCtl.minDate" @input="V.dayCtl.pickDate" style="height: 22px; box-sizing: border-box; padding: 0 6px; border-radius: 5px; border: 1px dashed #3a3e48; background: transparent; color: #c9c7c2; font-size: 11px; color-scheme: dark;">
              </div>
            </div>
          </template>
          <div :id="band.domId" @dragover="band.over" @drop="band.drop" @contextmenu="band.menu" :style="band.rowStyle">
            <div :style="band.rulerStyle">
              <span :style="band.tick"></span>
              <div :style="band.labelStyle">{{ band.label }}</div>
              <div :style="band.subStyle">{{ band.sub }}</div>
            </div>
            <div :style="band.dropStyle">
              <template v-for="(hi, _i_hi) in band.history" :key="_i_hi">
                <div style="display: flex; align-items: center; gap: 8px; height: 30px; max-width: 560px; margin-left: 218px; padding: 0 10px; border-radius: 6px; background: rgba(163,113,247,0.06); color: #9a9ca5; font-size: 12px;">
                  <span style="color: #c3a3fb; font-weight: 700;">✓</span>
                  <span style="font-size: 11px; color: #c3a3fb; white-space: nowrap; flex-shrink: 0;">{{ hi.how }}</span>
                  <span style="color: #c9c7c2; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ hi.title }}</span>
                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ hi.name }}</span>
                </div>
              </template>
              <template v-if="band.isOverdue">
                <div style="display: flex; align-items: center; gap: 8px; padding-left: 218px; font-size: 11px; color: #f0b85c;">
                  <span>{{ band.overdueNote }}</span>
                  <button @click="band.rollover" style="height: 22px; padding: 0 9px; border-radius: 5px; border: none; background: #e8a33d; color: #15161a; font-size: 11px; font-weight: 600; cursor: pointer;">Move to today</button>
                </div>
              </template>
              <template v-if="band.isOver">
                <div style="display: flex; align-items: center; gap: 8px; padding-left: 218px; font-size: 11px; color: #f28b7d;">
                  <span>{{ band.overNote }}</span>
                  <button @click="band.overflowMove" style="height: 22px; max-width: 360px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 9px; border-radius: 5px; border: 1px solid #ef6b5b; background: transparent; color: #f28b7d; font-size: 11px; font-weight: 600; cursor: pointer;">{{ band.overLabel }}</button>
                </div>
              </template>
              <template v-for="(b, _i_b) in band.blocks" :key="_i_b">
                <div style="display: flex; align-items: flex-start; gap: 8px;">
                  <div style="width: 210px; flex-shrink: 0; display: flex; flex-direction: column; padding-top: 3px;">
                    <template v-for="(cl, _i_cl) in b.cells" :key="_i_cl">
                      <div style="height: 40px; display: flex; align-items: center; justify-content: flex-end; gap: 6px; min-width: 0;">
                        <template v-if="cl.hasTag"><span :title="cl.tip" :style="cl.tagStyle">{{ cl.tag }}</span></template>
                        <template v-if="cl.hasInfo"><span :title="cl.tip" style="font-size: 11px; color: #9a9ca5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;">{{ cl.info }}</span></template>
                        <template v-for="(bt, _i_bt) in cl.btns" :key="_i_bt">
                          <button @click="bt.run" :disabled="bt.disabled" :title="bt.tip" :style="bt.style">{{ bt.label }}</button>
                        </template>
                      </div>
                    </template>
                  </div>
                  <div :draggable="b.draggable" @dragstart="b.dragStart" @dragend="V.dragEnd" @drop="b.dropOn" :title="b.tip" :style="b.boxStyle">
                    <template v-for="(r, _i_r) in b.rows" :key="_i_r">
                      <div :draggable="r.draggable" @dragstart="r.dragStart" @dragend="V.dragEnd" @click="r.pick" :style="r.style">
                        <span :style="r.indentStyle"><span :style="r.elbow"></span></span>
                        <span :style="r.dot"></span>
                        <template v-if="r.hasAgents">
                        <span title="Claude Code sessions" style="display: inline-flex; align-items: center; gap: 3px; height: 22px; padding: 0 5px 0 4px; box-sizing: border-box; border-radius: 11px; border: 1px solid #34373f; background: #0f1013; flex-shrink: 0;">
                          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#d97757" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 1px;"><rect x="3" y="4" width="18" height="16" rx="3"></rect><path d="M7 10l3 2-3 2M12 15h5"></path></svg>
                          <template v-for="(ai, _i_ai) in r.agentIcons" :key="_i_ai">
                            <span style="position: relative; display: inline-flex;">
                              <button @click="ai.open" @mouseenter="ai.enter" @mouseleave="ai.leave" @focus="ai.enter" @blur="ai.leave" :aria-label="ai.label" style="width: 16px; height: 18px; padding: 0; border: none; border-radius: 4px; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer;"><span :style="ai.style">{{ ai.glyph }}</span></button>
                              <template v-if="ai.hover">
                                <span role="tooltip" style="position: absolute; left: -4px; bottom: 26px; z-index: 30; padding: 6px 9px; border-radius: 6px; background: #26282e; border: 1px solid #3a3e48; box-shadow: 0 6px 18px rgba(0,0,0,0.45); white-space: nowrap; display: flex; flex-direction: column; gap: 1px; pointer-events: none;">
                                  <span style="font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #e8e6e1;">{{ ai.tipTitle }}</span>
                                  <span style="font-size: 11px;"><span :style="ai.tipStateStyle">{{ ai.tipState }}</span> <span style="color: #9a9ca5;">· {{ ai.tipLast }}</span></span>
                                </span>
                              </template>
                            </span>
                          </template>
                        </span>
                        </template>
                        <template v-if="r.isReview">
                          <span title="Someone else's branch: read-only here" style="display: inline-flex; align-items: center; gap: 5px; height: 20px; padding: 0 8px; border-radius: 999px; background: rgba(122,167,255,0.16); color: #93b6ff; font-size: 11px; font-weight: 600; flex-shrink: 0;">
                            <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
                            {{ r.owner }}
                          </span>
                        </template>
                        <button @click="r.pick" :aria-label="'Open ' + (r.name)" style="flex-grow: 1; min-width: 0; height: 100%; padding: 0; border: none; background: transparent; color: inherit; display: flex; flex-direction: column; justify-content: center; cursor: pointer; text-align: left;">
                          <span :style="r.titleStyle">{{ r.title }}</span>
                          <template v-if="r.hasBranch"><span :style="r.branchStyle">{{ r.branchText }}</span></template>
                        </button>
                      </div>
                    </template>
                  </div>
                </div>
              </template>
              <template v-for="(sp, _i_sp) in band.spans" :key="_i_sp">
                <button @click="sp.pick" :title="sp.tip" :style="sp.style">
                  <span style="color: #7c7f88;">↳</span>

    if (s.dialog) {
      var D = s.dialog, dby = {}; DATA[D.repo].forEach(function (b) { dby[b.id] = b; });

          var b = dby[tg.branch], rs = running(b);

              return { label: o.label + (rs.length === 1 ? ' (only agent)' : ''), style: chipStyle(tg.choice === o.id), pick: function () { var nd = Object.assign({}, self.state.dialog); nd.targets = nd.targets.map(function (x, xi) { return xi === ti ? Object.assign({}, x, { choice: o.id }) : x; }); self.setState({ dialog: nd }); } };
            })

        }),
        askWt: !!D.askWt,
        wtOptions: [['same', 'same worktree'], ['new', 'new worktree']].filter(function (w) { return !(D.noSame && w[0] === 'same'); }).map(function (w) {
          return { label: w[1], style: chipStyle(D.wt === w[0]), pick: function () { self.setState({ dialog: Object.assign({}, self.state.dialog, { wt: w[0] }) }); } };
        })

    var behindRoots = mineB.filter(function (bk) { return !bk.parked && !bk.cont && by[bk.root].kind === 'mine' && behind(bk.root) > 0 && !s.merged[bk.root]; }).map(function (bk) { return bk.root; });
    var F = s.fetch[repo];
    return {
      repoTabs: repoTabs, isAll: s.repo === '*', isRepo: s.repo !== '*', allView: allView,

      },
      onMainScroll: function (e) {
        var today = document.getElementById('aq-day-0'); if (!today) return;
        var header = e.target.firstElementChild ? e.target.firstElementChild.offsetHeight : 48;
        var h2 = e.target.scrollTop + header < today.offsetTop - 30;
        if (h2 !== self.state.inHistory) self.setState({ inHistory: h2 });
      },
      backToToday: function () { self.scrollToDay(self.focusDay || 0); },
      goToDate: function (e) {
        var v = e.target.value; if (!v) return;
        var p = v.split('-'); var k = offsetOf(new Date(+p[0], +p[1] - 1, +p[2]));
        if (k < -self.state.history) self.setState({ history: -k + 2 });
        if (k >= self.state.horizon && self.state.extraDays.indexOf(k) < 0) self.setState({ extraDays: self.state.extraDays.concat([k]) });

      }
    };
  }
}
