services:
  postgres:
    image: postgres:16-alpine
    container_name: kira-postgres
    environment:
      POSTGRES_USER: kira
      POSTGRES_PASSWORD: kira
      POSTGRES_DB: kira
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - kira-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kira -d kira"]
      interval: 2s
      timeout: 5s
      retries: 20

  mariadb:
    image: mariadb:11
    container_name: kira-mariadb
    environment:
      MARIADB_USER: kira
      MARIADB_PASSWORD: kira
      MARIADB_DATABASE: kira
      MARIADB_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./mariadb/init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - kira-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 20

  mongo:
    image: mongo:7
    container_name: kira-mongo
    environment:
      MONGO_INITDB_DATABASE: kira
    ports:
      - "27017:27017"
    volumes:
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
      - kira-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: kira-redis
    ports:
      - "6379:6379"
    volumes:
      - kira-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  kira-pg-data:
  kira-mariadb-data:
  kira-mongo-data:
  kira-redis-data:
