version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it (#4637).
    run: once
    # The module is at the workspace root (P3 D2), not this directory — these are the files
    # `go mod tidy` reads and writes, and without them the task reruns on every build (P20 F12).
    sources:
      - ../../go.mod
      - ../../go.sum
      - "**/*.go"
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install workspace dependencies (Bun workspace root — one lockfile for every app)
    run: once
    dir: '{{.WORKSPACE_ROOT}}'
    sources:
      - package.json
      - bun.lock
      - apps/*/frontend/package.json
    # A bare directory here makes Task treat the task as never up to date, so `bun install` — and
    # the `prepare` hook it fires — reran three times per `bun run dev` (P20 F2/F3).
    generates:
      - node_modules/**/*
    preconditions:
      - sh: bun --version
        msg: "bun not found — install it from https://bun.sh"
    cmds:
      - bun install

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    # darwin:build:universal runs its per-arch builds as parallel deps, each of
    # which depends on this task. Without run:once the two executions race:
    # one regenerates frontend/bindings (-clean deletes it first) while the
    # other's bundler is reading it, failing intermittently with
    # 'Could not resolve "./bindings/<pkg>"' (#4637).
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
      - exclude: dist/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          OBFUSCATED:
            ref: .OBFUSCATED
    cmds:
      - bun run {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  dev:frontend:
    summary: Runs the frontend dev server (Vite) for `wails3 dev`
    dir: frontend
    deps:
      - task: install:frontend:deps
    cmds:
      - bun run dev --port {{.VITE_PORT}} --strictPort

  generate:bindings:
    summary: Generates bindings for the frontend
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*  # Rerun when switching between dev/production mode causes changes in output
      - "**/*.go"
      # The module is at the workspace root (P3 D2). Named `go.mod`/`go.sum` these matched nothing,
      # so a dependency-only bump — P19's beta.15 -> beta.16 was exactly that — never regenerated
      # anything (P20 F4).
      - ../../go.mod
      - ../../go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true{{if eq .OBFUSCATED "true"}} -obfuscated{{end}} -b -names -ts -i

  generate:icons:
    summary: Generates the Mac `.icns` from an image; `-iconcomposerinput appicon.icon -macassetdir darwin` also produces `Assets.car` from a `.icon` file. `-windowsfilename` has no off switch in the CLI itself (always writes one), so it's redirected into `.task/unused-icon.ico` — a macOS-only app has no `build/windows/` to write it into.
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
    cmds:
      - mkdir -p .task
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename .task/unused-icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  update:build-assets:
    summary: Updates the build assets
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .

