version: '3'

vars:
  APP_NAME: "Kira Studio"
  BIN_DIR: "bin"
  # This repository has exactly one package manager (docs/ARCHITECTURE.md's Stack table).
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # The Bun workspace root: one lockfile, one node_modules, for every app and package.
  WORKSPACE_ROOT: '{{.ROOT_DIR}}/../..'
  # The app's version. `build/config.yml`'s `info.version` is the single source — it is where Wails
  # already puts an app's version, and what `common:update:build-assets` writes into a regenerated
  # Info.plist — and release.yml writes the git tag into it before packaging. Every build stamps
  # whatever it says into the binary (VERSION_VAR below, via `-ldflags -X`) and into the bundle's
  # own Info.plist (create:app:bundle), so the app, the plist and this file cannot disagree.
  # The root package.json's `version` is npm metadata for a private, unpublished workspace; nothing
  # reads it, and it is deliberately not this.
  APP_VERSION:
    sh: |
      v=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "{{.ROOT_DIR}}/build/config.yml" | head -1)
      [ -n "$v" ] || v=0.0.0-unknown
      printf '%s' "$v"
  VERSION_VAR: 'github.com/kirathecat/kira-studio/apps/kira-studio/internal/buildinfo.Version'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
