<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P165 empty scroller</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #1f1f1f;
      }
      /* Same box and scroll extent as the grids (10 000 rows x 28 px), no content: the Mac
         footprint control for a bare native scroller. */
      #scroller {
        width: 100vw;
        height: 100vh;
        overflow: auto;
      }
      #scroller > div {
        height: 280000px;
        width: 2400px;
      }
    </style>
  </head>
  <body>
    <div id="scroller" class="grid-scrollable"><div></div></div>
  </body>
</html>
