version: '3'

vars:
  APP_NAME: "Kira Space"
  BIN_DIR: "bin"
  # This repository has exactly one package manager (docs/ARCHITECTURE.md's Stack table).
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "bun"}}'
  # 9246, not Kira Studio's 9245 — the two dev servers must be able to run side by side.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9246}}'
  # The Bun workspace root: one lockfile, one node_modules, for every app and package.
  WORKSPACE_ROOT: '{{.ROOT_DIR}}/../..'
  # Same "build/config.yml's info.version is the single source" convention as Kira Studio's own
  # Taskfile.yml.
  APP_VERSION:
    sh: |
      v=$(sed -n 's/^  version: *"\([^"]*\)".*/\1/p' "{{.ROOT_DIR}}/build/config.yml" | head -1)
      [ -n "$v" ] || v=0.0.0-unknown
      printf '%s' "$v"
  VERSION_VAR: 'github.com/kirathecat/kira-studio/apps/kira-space/internal/buildinfo.Version'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: darwin:build

  package:
    summary: Packages a production build of the application
    cmds:
      - task: darwin:package

  run:
    summary: Runs the application
    cmds:
      - task: darwin:run

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
