id: standard
name: Standard feature
steps:
  - id: spec
    name: Spec
    kind: manual
    session: true
    prompt: |
      Let's write the spec for {task} ({jira}). Ask me questions until it is clear. Do not change any code.
  - id: plan
    name: Plan from spec
    kind: agent
    runs_on: once
    before: auto
    timeout: 20m
    prompt: |
      Read the task spec and the Jira ticket {jira}. Write an implementation plan per repo. Do not change code yet.
  - id: impl
    name: Implement
    kind: agent
    runs_on: each repo
    before: auto
    results:
      - id: done
        ok: true
      - id: failed
        ok: false
        next: impl
    max_returns: 1
    timeout: 2h
    prompt: |
      Implement the plan for {repo} on {branch} in {worktree}. Commit in small steps.
  - id: tests
    name: Write tests
    kind: agent
    runs_on: each repo
    before: auto
    results:
      - id: done
        ok: true
      - id: failed
        ok: false
        next: impl
    timeout: 1h
    prompt: |
      Add or update tests for the changes on {branch}. If they fail because of the implementation, report what fails.
  - id: ci
    name: Make CI green
    kind: agent
    runs_on: each repo
    before: auto
    results:
      - id: done
        ok: true
      - id: failed
        ok: false
        next: impl
    timeout: 1h
    prompt: |
      Run the checks for {branch}. Fix failures until they pass.
  - id: pr
    name: Open PRs
    kind: agent
    runs_on: each repo
    before: approval
    timeout: 15m
    prompt: |
      Open a draft PR for {branch} and link {jira}.
  - id: review
    name: Review
    kind: manual
    status: in-review
    session: true
    prompt: |
      Help me go through the review comments on {branch} and address them.
  - id: release
    name: Release
    kind: script
    status: in-review
    runs_on: each repo
    before: auto
    timeout: 15m
    command: |
      ./scripts/release.sh --branch {branch}
