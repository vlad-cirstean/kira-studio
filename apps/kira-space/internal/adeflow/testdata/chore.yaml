id: chore
name: Maintenance
steps:
  - id: update
    name: Apply the change
    kind: agent
    runs_on: each repo
    before: auto
    timeout: 1h
    prompt: |
      Apply the change described in the task on {branch}.
  - id: ci
    name: Make CI green
    kind: agent
    runs_on: each repo
    before: auto
    results:
      - id: done
        ok: true
      - id: failed
        ok: false
        next: ci
    max_returns: 2
    timeout: 1h
    prompt: |
      Run the checks for {branch}. Fix failures until they pass.
  - id: release
    name: Release
    kind: script
    status: In review
    runs_on: each repo
    before: auto
    timeout: 10m
    command: |
      make release
